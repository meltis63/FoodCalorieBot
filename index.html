<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник питания</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #ffffff; --surface: #f5f5f7; --surface2: #eeeef0;
    --text: #1a1a1a; --text2: #6e6e73;
    --accent: #34c759; --accent-dim: rgba(52,199,89,.12);
    --red: #ff3b30; --orange: #ff9500; --blue: #007aff;
    --border: rgba(0,0,0,.06); --radius: 14px; --shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --surface: #2c2c2e; --surface2: #3a3a3c;
      --text: #f2f2f7; --text2: #98989e;
      --border: rgba(255,255,255,.08); --shadow: 0 1px 3px rgba(0,0,0,.3);
    }
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text);
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 15px; }
  .loading .spinner { width: 32px; height: 32px; border: 3px solid var(--surface2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .date-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 16px; }
  .date-nav button {
    background: var(--surface); border: none; color: var(--text);
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  .date-nav button:active { background: var(--surface2); }
  .date-label { font-size: 15px; font-weight: 600; cursor: pointer;
    padding: 4px 12px; border-radius: 8px; transition: background .15s; }
  .date-label:active { background: var(--surface2); }

  .summary {
    background: var(--surface); border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .summary-row { display: flex; align-items: center; gap: 20px; }
  .ring-wrap { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--surface2); stroke-width: 7; }
  .ring-fill { fill: none; stroke: var(--accent); stroke-width: 7;
    stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
  .ring-text { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .ring-kcal { font-size: 22px; font-weight: 700; line-height: 1; }
  .ring-label { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .macros { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .macro-row { display: flex; align-items: center; gap: 8px; }
  .macro-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .macro-dot.p { background: var(--blue); } .macro-dot.f { background: var(--orange); }
  .macro-dot.c { background: var(--accent); }
  .macro-name { font-size: 13px; color: var(--text2); width: 52px; }
  .macro-bar-bg { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .macro-bar { height: 100%; border-radius: 3px; transition: width .4s ease; }
  .macro-bar.p { background: var(--blue); } .macro-bar.f { background: var(--orange); }
  .macro-bar.c { background: var(--accent); }
  .macro-val { font-size: 13px; font-weight: 600; width: 44px; text-align: right; }

  .meal-section { margin-bottom: 12px; }
  .meal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); cursor: pointer; user-select: none;
  }
  .meal-header:active { background: var(--surface2); }
  .meal-left { display: flex; align-items: center; gap: 10px; }
  .meal-icon { font-size: 22px; } .meal-title { font-size: 15px; font-weight: 600; }
  .meal-kcal { font-size: 14px; color: var(--text2); font-weight: 500; }
  .meal-items { padding: 4px 0 0; overflow: hidden; max-height: 0; transition: max-height .3s ease; }
  .meal-items.open { max-height: 2000px; }
  .item-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; margin: 4px 0; background: var(--surface); border-radius: 10px;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .item-kcal { font-size: 14px; font-weight: 600; margin-left: 12px; white-space: nowrap; }
  .item-del { background: none; border: none; color: var(--red); font-size: 18px;
    margin-left: 8px; cursor: pointer; padding: 4px; }

  .add-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 10px; margin-top: 4px; border: 1.5px dashed var(--border);
    border-radius: 10px; background: transparent; color: var(--text2);
    font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  .add-btn:active { background: var(--surface); }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: none; align-items: flex-end; justify-content: center; z-index: 100; }
  .overlay.show { display: flex; }
  .modal { background: var(--bg); width: 100%; max-width: 480px;
    border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0));
    animation: slideUp .25s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } }
  .modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
  .modal label { display: block; font-size: 13px; font-weight: 500;
    color: var(--text2); margin-bottom: 4px; margin-top: 12px; }
  .modal input, .modal select {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 15px; background: var(--surface);
    color: var(--text); font-family: inherit; outline: none; }
  .modal input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-cancel { background: var(--surface); color: var(--text); }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-save:active { opacity: .85; }
  .goal-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .goal-row span { font-size: 13px; color: var(--text2); }
  .goal-edit { background: none; border: none; color: var(--blue); font-size: 13px;
    font-weight: 600; cursor: pointer; font-family: inherit; }
  .sync-status { font-size: 11px; color: var(--text2); text-align: center; padding: 4px 0; }

  /* Calendar */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-header button { background: var(--surface); border: none; color: var(--text);
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; }
  .cal-header button:active { background: var(--surface2); }
  .cal-month { font-size: 15px; font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-dow { font-size: 11px; color: var(--text2); padding: 4px 0; font-weight: 500; }
  .cal-day {
    font-size: 13px; padding: 8px 0; border-radius: 8px; cursor: pointer;
    border: none; background: transparent; color: var(--text); font-family: inherit;
  }
  .cal-day:active { background: var(--surface2); }
  .cal-day.today { font-weight: 700; color: var(--accent); }
  .cal-day.selected { background: var(--accent); color: #fff; font-weight: 600; }
  .cal-day.disabled { color: var(--surface2); pointer-events: none; }
  .cal-day.has-data { position: relative; }
  .cal-day.has-data::after {
    content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
  }
  .cal-day.selected.has-data::after { background: #fff; }
</style>
</head>
<body>

<div class="container">
  <div class="loading" id="loadingScreen">
    <div class="spinner"></div>
    Загрузка дневника...
  </div>

  <div id="appContent" style="display:none">
    <div class="date-nav">
      <button id="prevDay">‹</button>
      <span class="date-label" id="dateLabel"></span>
      <button id="nextDay">›</button>
    </div>

    <div class="summary">
      <div class="summary-row">
        <div class="ring-wrap">
          <svg viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="42"/>
            <circle class="ring-fill" id="ring" cx="50" cy="50" r="42"
              stroke-dasharray="263.9" stroke-dashoffset="263.9"/>
          </svg>
          <div class="ring-text">
            <span class="ring-kcal" id="totalKcal">0</span>
            <span class="ring-label">ккал</span>
          </div>
        </div>
        <div class="macros">
          <div class="macro-row"><div class="macro-dot p"></div><span class="macro-name">Белки</span>
            <div class="macro-bar-bg"><div class="macro-bar p" id="barP" style="width:0%"></div></div>
            <span class="macro-val" id="valP">0 г</span></div>
          <div class="macro-row"><div class="macro-dot f"></div><span class="macro-name">Жиры</span>
            <div class="macro-bar-bg"><div class="macro-bar f" id="barF" style="width:0%"></div></div>
            <span class="macro-val" id="valF">0 г</span></div>
          <div class="macro-row"><div class="macro-dot c"></div><span class="macro-name">Углеводы</span>
            <div class="macro-bar-bg"><div class="macro-bar c" id="barC" style="width:0%"></div></div>
            <span class="macro-val" id="valC">0 г</span></div>
        </div>
      </div>
      <div class="goal-row" style="margin-top:12px">
        <span>Цель: <strong id="goalDisplay">2000</strong> ккал</span>
        <button class="goal-edit" id="goalBtn">Изменить</button>
      </div>
    </div>

    <div id="mealsContainer"></div>
    <div class="sync-status" id="syncStatus"></div>
  </div>
</div>

<!-- Add item modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Добавить</h3>
    <label>Название</label>
    <input type="text" id="inpName" placeholder="Куриная грудка">
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>Вес, г</label><input type="number" id="inpWeight" placeholder="150"></div>
      <div style="flex:1"><label>Ккал</label><input type="number" id="inpKcal" placeholder="230"></div>
    </div>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>Белки, г</label><input type="number" id="inpP" placeholder="30"></div>
      <div style="flex:1"><label>Жиры, г</label><input type="number" id="inpF" placeholder="5"></div>
      <div style="flex:1"><label>Углеводы, г</label><input type="number" id="inpC" placeholder="0"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancel">Отмена</button>
      <button class="btn-save" id="btnSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Goal modal -->
<div class="overlay" id="goalOverlay">
  <div class="modal">
    <h3>Дневная цель</h3>
    <label>Калории, ккал</label>
    <input type="number" id="inpGoal" placeholder="2000">
    <div class="modal-actions">
      <button class="btn-cancel" id="goalCancel">Отмена</button>
      <button class="btn-save" id="goalSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Calendar modal -->
<div class="overlay" id="calOverlay">
  <div class="modal">
    <div class="cal-header">
      <button id="calPrev">‹</button>
      <span class="cal-month" id="calMonth"></span>
      <button id="calNext">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn-cancel" id="calToday" style="flex:none;padding:10px 20px">Сегодня</button>
      <button class="btn-cancel" id="calClose">Закрыть</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, collection, query, orderBy, limit, getDocs } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyABb-lepQ-9GhHPxWRCimaWvSzP857mfw8",
  authDomain: "foodcaloriebot.firebaseapp.com",
  projectId: "foodcaloriebot",
  storageBucket: "foodcaloriebot.firebasestorage.app",
  messagingSenderId: "908304594252",
  appId: "1:908304594252:web:09fb9c2aceb567b5618be9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const MEALS = [
  { key: 'breakfast', icon: '🌅', title: 'Завтрак' },
  { key: 'lunch',     icon: '☀️', title: 'Обед' },
  { key: 'snack',     icon: '🍎', title: 'Полдник' },
  { key: 'dinner',    icon: '🌙', title: 'Ужин' },
];

let currentDate = todayStr();
let openMeal = null;
let activeMealKey = null;
let userId = null;
let cache = {};
let earliestDate = null;

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ── Firebase helpers ──
async function loadDay(date) {
  if (cache[date]) return cache[date];
  try {
    const snap = await getDoc(doc(db, 'users', userId, 'days', date));
    const data = snap.exists() ? snap.data() : {};
    cache[date] = data;
    return data;
  } catch (e) {
    console.error('Load error:', e);
    return {};
  }
}

async function saveDay(date, data) {
  cache[date] = data;
  try {
    await setDoc(doc(db, 'users', userId, 'days', date), data);
    daysWithData.add(date);
    if (!earliestDate || date < earliestDate) earliestDate = date;
    showSync('Сохранено ✓');
  } catch (e) {
    console.error('Save error:', e);
    showSync('Ошибка сохранения');
  }
}

async function getGoal() {
  try {
    const snap = await getDoc(doc(db, 'users', userId));
    return snap.exists() && snap.data().goal ? snap.data().goal : 2000;
  } catch { return 2000; }
}

async function setGoalVal(v) {
  try {
    await setDoc(doc(db, 'users', userId), { goal: v }, { merge: true });
  } catch (e) { console.error('Goal save error:', e); }
}

function showSync(text) {
  const el = document.getElementById('syncStatus');
  el.textContent = text;
  setTimeout(() => { el.textContent = ''; }, 2000);
}

function formatDate(str) {
  const d = new Date(str + 'T12:00:00');
  const today = todayStr();
  const y = new Date(); y.setDate(y.getDate()-1);
  const ys = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
  if (str === today) return 'Сегодня';
  if (str === ys) return 'Вчера';
  return d.toLocaleDateString('ru-RU', { day:'numeric', month:'long', weekday:'short' });
}

function shiftDate(str, delta) {
  const d = new Date(str + 'T12:00:00');
  d.setDate(d.getDate() + delta);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function render() {
  const data = await loadDay(currentDate);
  const goal = await getGoal();
  document.getElementById('dateLabel').textContent = formatDate(currentDate);
  document.getElementById('goalDisplay').textContent = goal;
  updateNavButtons();

  let tK=0, tP=0, tF=0, tC=0;
  MEALS.forEach(m => {
    (data[m.key]||[]).forEach(it => {
      tK += it.kcal||0; tP += it.p||0; tF += it.f||0; tC += it.c||0;
    });
  });

  document.getElementById('totalKcal').textContent = Math.round(tK);
  const pct = Math.min(tK / goal, 1);
  const circ = 263.9;
  document.getElementById('ring').style.strokeDashoffset = circ - circ * pct;
  document.getElementById('ring').style.stroke = pct >= 1 ? 'var(--red)' : 'var(--accent)';

  const mxP = goal*0.3/4, mxF = goal*0.3/9, mxC = goal*0.5/4;
  document.getElementById('barP').style.width = Math.min(tP/mxP*100,100)+'%';
  document.getElementById('barF').style.width = Math.min(tF/mxF*100,100)+'%';
  document.getElementById('barC').style.width = Math.min(tC/mxC*100,100)+'%';
  document.getElementById('valP').textContent = Math.round(tP)+' г';
  document.getElementById('valF').textContent = Math.round(tF)+' г';
  document.getElementById('valC').textContent = Math.round(tC)+' г';

  const container = document.getElementById('mealsContainer');
  container.innerHTML = '';
  MEALS.forEach(m => {
    const items = data[m.key] || [];
    const mK = items.reduce((s,i) => s+(i.kcal||0), 0);
    const sec = document.createElement('div');
    sec.className = 'meal-section';
    sec.innerHTML = `
      <div class="meal-header" data-meal="${m.key}">
        <div class="meal-left"><span class="meal-icon">${m.icon}</span>
          <span class="meal-title">${m.title}</span></div>
        <span class="meal-kcal">${Math.round(mK)} ккал</span>
      </div>
      <div class="meal-items ${openMeal===m.key?'open':''}" id="items_${m.key}">
        ${items.map((it,i) => `
          <div class="item-row">
            <div class="item-info">
              <div class="item-name">${esc(it.name)}</div>
              <div class="item-meta">${it.weight?it.weight+' г · ':''}Б ${Math.round(it.p||0)} · Ж ${Math.round(it.f||0)} · У ${Math.round(it.c||0)}</div>
            </div>
            <span class="item-kcal">${Math.round(it.kcal||0)} ккал</span>
            <button class="item-del" data-meal="${m.key}" data-idx="${i}">✕</button>
          </div>`).join('')}
        <button class="add-btn" data-meal="${m.key}">+ Добавить</button>
      </div>`;
    container.appendChild(sec);
  });

  container.querySelectorAll('.meal-header').forEach(h => {
    h.addEventListener('click', () => { openMeal = openMeal===h.dataset.meal ? null : h.dataset.meal; render(); });
  });
  container.querySelectorAll('.add-btn').forEach(b => {
    b.addEventListener('click', () => openModal(b.dataset.meal));
  });
  container.querySelectorAll('.item-del').forEach(b => {
    b.addEventListener('click', () => deleteItem(b.dataset.meal, parseInt(b.dataset.idx)));
  });
}

async function deleteItem(meal, idx) {
  const data = await loadDay(currentDate);
  if (data[meal]) { data[meal].splice(idx, 1); await saveDay(currentDate, data); }
  render();
}

function openModal(mealKey) {
  activeMealKey = mealKey;
  const m = MEALS.find(x=>x.key===mealKey);
  document.getElementById('modalTitle').textContent = m.title;
  ['inpName','inpWeight','inpKcal','inpP','inpF','inpC'].forEach(id => document.getElementById(id).value='');
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('btnCancel').onclick = () => document.getElementById('overlay').classList.remove('show');
document.getElementById('btnSave').onclick = async () => {
  const name = document.getElementById('inpName').value.trim();
  if (!name) return;
  const item = {
    name,
    weight: parseFloat(document.getElementById('inpWeight').value)||0,
    kcal: parseFloat(document.getElementById('inpKcal').value)||0,
    p: parseFloat(document.getElementById('inpP').value)||0,
    f: parseFloat(document.getElementById('inpF').value)||0,
    c: parseFloat(document.getElementById('inpC').value)||0,
  };
  const data = await loadDay(currentDate);
  if (!data[activeMealKey]) data[activeMealKey] = [];
  data[activeMealKey].push(item);
  await saveDay(currentDate, data);
  document.getElementById('overlay').classList.remove('show');
  openMeal = activeMealKey;
  render();
};

document.getElementById('goalBtn').onclick = async () => {
  document.getElementById('inpGoal').value = await getGoal();
  document.getElementById('goalOverlay').classList.add('show');
};
document.getElementById('goalCancel').onclick = () => document.getElementById('goalOverlay').classList.remove('show');
document.getElementById('goalSave').onclick = async () => {
  const v = parseInt(document.getElementById('inpGoal').value);
  if (v > 0) await setGoalVal(v);
  document.getElementById('goalOverlay').classList.remove('show');
  render();
};

let daysWithData = new Set();

function maxDateStr() {
  return shiftDate(todayStr(), 7);
}

async function loadEarliestDate() {
  try {
    const daysRef = collection(db, 'users', userId, 'days');
    const snap = await getDocs(daysRef);
    snap.forEach(d => daysWithData.add(d.id));
    const sorted = [...daysWithData].sort();
    earliestDate = sorted.length ? sorted[0] : todayStr();
  } catch (e) {
    console.error('Earliest date error:', e);
    earliestDate = todayStr();
  }
}

function updateNavButtons() {
  const prevBtn = document.getElementById('prevDay');
  const nextBtn = document.getElementById('nextDay');
  prevBtn.disabled = earliestDate && currentDate <= earliestDate;
  prevBtn.style.opacity = prevBtn.disabled ? '0.3' : '1';
  nextBtn.disabled = currentDate >= maxDateStr();
  nextBtn.style.opacity = nextBtn.disabled ? '0.3' : '1';
}

document.getElementById('prevDay').onclick = () => {
  if (earliestDate && currentDate <= earliestDate) return;
  currentDate = shiftDate(currentDate, -1);
  render();
};
document.getElementById('nextDay').onclick = () => {
  if (currentDate >= maxDateStr()) return;
  currentDate = shiftDate(currentDate, +1);
  render();
};

// ── Calendar ──
let calYear, calMonth;

function openCalendar() {
  const d = new Date(currentDate + 'T12:00:00');
  calYear = d.getFullYear();
  calMonth = d.getMonth();
  renderCalendar();
  document.getElementById('calOverlay').classList.add('show');
}

function renderCalendar() {
  const months = ['Январь','Февраль','Март','Апрель','Май','Июнь',
    'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  document.getElementById('calMonth').textContent = `${months[calMonth]} ${calYear}`;

  const grid = document.getElementById('calGrid');
  const dows = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  let html = dows.map(d => `<span class="cal-dow">${d}</span>`).join('');

  const first = new Date(calYear, calMonth, 1);
  let startDow = first.getDay() - 1;
  if (startDow < 0) startDow = 6;
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = todayStr();
  const max = maxDateStr();

  for (let i = 0; i < startDow; i++) html += '<span></span>';

  for (let day = 1; day <= daysInMonth; day++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday = ds === today;
    const isSelected = ds === currentDate;
    const isBefore = earliestDate && ds < earliestDate;
    const isAfter = ds > max;
    const hasData = daysWithData.has(ds);

    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';
    if (isBefore || isAfter) cls += ' disabled';
    if (hasData) cls += ' has-data';

    html += `<button class="${cls}" data-date="${ds}">${day}</button>`;
  }
  grid.innerHTML = html;

  grid.querySelectorAll('.cal-day:not(.disabled)').forEach(btn => {
    btn.addEventListener('click', () => {
      currentDate = btn.dataset.date;
      document.getElementById('calOverlay').classList.remove('show');
      render();
    });
  });
}

document.getElementById('dateLabel').onclick = openCalendar;
document.getElementById('calPrev').onclick = () => {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
};
document.getElementById('calNext').onclick = () => {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
};
document.getElementById('calToday').onclick = () => {
  currentDate = todayStr();
  document.getElementById('calOverlay').classList.remove('show');
  render();
};
document.getElementById('calClose').onclick = () => {
  document.getElementById('calOverlay').classList.remove('show');
};

// ── Init ──
async function init() {
  // Get Telegram user ID
  if (window.Telegram?.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    const p = tg.themeParams;
    if (p.bg_color) document.documentElement.style.setProperty('--bg', p.bg_color);
    if (p.secondary_bg_color) document.documentElement.style.setProperty('--surface', p.secondary_bg_color);
    if (p.text_color) document.documentElement.style.setProperty('--text', p.text_color);
    if (p.hint_color) document.documentElement.style.setProperty('--text2', p.hint_color);
    if (p.button_color) document.documentElement.style.setProperty('--accent', p.button_color);

    userId = String(tg.initDataUnsafe?.user?.id || 'anonymous');
  } else {
    userId = 'anonymous';
  }

  await loadEarliestDate();
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appContent').style.display = 'block';
  await render();
}

init();
</script>
